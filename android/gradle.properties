org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The Kotlin compile daemon is a SECOND JVM beside Gradle's, and with this
# unset it inherits the line above — so two processes each reserve 8G of
# heap and 4G of metaspace on a 20G machine. Release builds died with
# "Daemon compilation failed: null", once per plugin, each blamed on
# "Could not close incremental caches": the symptom of a daemon killed
# mid-write, not of a cache that was ever bad.
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G

# Nothing here is ever compiled twice — every release build is a fresh
# checkout of the same sources — so the incremental caches only cost write
# traffic and the failure mode above. Turning them off removes the code
# path that was crashing.
kotlin.incremental=false
